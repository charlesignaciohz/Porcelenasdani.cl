<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porcelanasdani.cl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="navbar navbar-expand py-3 px-4 barra-navegacion">
        <div class="container-fluid justify-content-start">
            <ul class="navbar-nav flex-row gap-4">
                <li class="nav-item">
                    <a class="nav-link enlace-menu" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link enlace-menu" href="Galeria.html">Galería</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link enlace-menu enlace-activo" href="Contacto.html">Contacto</a>
                </li>
            </ul>
        </div>
    </nav>
    

<main class="container my-2">
        <h1 class="titulo-contacto text-center mb-1">Contacto</h1>
        <p class="parrafo-corto mb-3">
            Si deseas contactarnos, no dudes en escribirnos a través del formulario o en nuestras redes sociales
        </p>

        <div class="row align-items-start g-3">
           
            <div class="col-12 col-md-5 text-center">
                <img src="contactouno.jpeg" alt="Porcelanasdani" class="img-fluid imagen-contacto rounded-3">
            </div>
            <div class="col-12 col-md-7">
                <div class="tarjeta-formulario tarjeta-contacto-compacta">
                    <form action="#" method="POST" class="formulario-contacto">
                        <div class="campo-grupo">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                        </div>
                        <div class="campo-grupo">
                            <label for="correo">Correo Electrónico:</label>
                            <input type="email" id="correo" name="correo" placeholder="Tucorreo@gmail.com">
                        </div>
                        <div class="campo-grupo">
                            <label for="asunto">Asunto:</label>
                            <select id="asunto" name="asunto">
                                <option value="" disabled selected>Selecciona un asunto</option>
                                <option value="encargo">Encargo personalizado</option>
                                <option value="consulta">Consulta general</option>
                            </select>
                        </div>
                        <div class="campo-grupo">
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" rows="2" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>
                        <button type="submit" class="btn-enviar">Enviar</button>
                    </form>
                </div>
            <div class="text-center mt-2">
                    <img src="contactodos.jpeg" alt="Porcelanasdani" class="img-fluid imagen-contacto-bajo rounded-3">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
